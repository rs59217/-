<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H Essentials</title>

<style>
:root{
  --bg:#0e0e11;
  --card:#16161c;
  --primary:#7b5cff;
  --text:#f5f5f5;
  --muted:#9a9a9a;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial}

body{background:var(--bg);color:var(--text);overflow-x:hidden}

header{
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{letter-spacing:3px;font-weight:600}
nav span{margin-left:20px;cursor:pointer;color:var(--muted)}

.hero{
  height:70vh;
  background:linear-gradient(#0009,#000c),
  url("https://images.unsplash.com/photo-1518544887879-8d2f7b1f5a44") center/cover;
  display:flex;
  align-items:center;
  padding:40px;
}
.hero h1{font-size:3rem}

section{padding:60px 40px}

.filters button{
  background:none;
  border:1px solid var(--primary);
  color:var(--text);
  margin-right:10px;
  padding:8px 16px;
  cursor:pointer;
}
.filters button:hover{background:var(--primary)}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}
.card{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  transition:.3s;
}
.card:hover{transform:translateY(-8px)}
.card img{width:100%;height:260px;object-fit:cover}
.card h3{padding:10px}
.price{color:var(--primary);padding:0 10px}
.card button{
  width:100%;
  padding:10px;
  border:none;
  background:var(--primary);
  color:white;
  cursor:pointer;
}

.cart-btn{
  position:fixed;
  top:20px;
  right:20px;
  background:var(--primary);
  padding:10px 15px;
  border-radius:50px;
  cursor:pointer;
}
.cart-btn span{
  background:black;
  padding:2px 8px;
  border-radius:20px;
  margin-left:6px;
}

.modal{
  position:fixed;
  inset:0;
  background:#000a;
  display:none;
  justify-content:center;
  align-items:center;
}
.modal-content{
  background:var(--card);
  padding:30px;
  width:320px;
  border-radius:10px;
}
.modal-content button{
  margin-top:15px;
  width:100%;
  padding:10px;
  background:var(--primary);
  border:none;
  color:white;
}

footer{text-align:center;padding:30px;color:var(--muted)}
</style>
</head>

<body>

<header>
  <div class="logo">H ESSENTIALS</div>
  <nav>
    <span onclick="openAdmin()">Admin</span>
  </nav>
</header>

<div class="cart-btn" onclick="openCart()">
  🛒 <span id="cartCount">0</span>
</div>

<section class="hero">
  <h1>FOR THE FEW.<br>ESSENTIALS.</h1>
</section>

<section>
  <div class="filters">
    <button onclick="filter('all')">Todo</button>
    <button onclick="filter('ropa')">Ropa</button>
    <button onclick="filter('accesorio')">Accesorios</button>
  </div>
</section>

<section>
  <div class="products" id="products"></div>
</section>

<footer>© 2026 H Essentials</footer>

<!-- CARRITO -->
<div class="modal" id="cart">
  <div class="modal-content">
    <h3>Carrito</h3>
    <div id="cartItems"></div>
    <p>Total: $<span id="total">0</span></p>
    <button onclick="checkout()">Checkout</button>
    <button onclick="sendWhatsApp()">WhatsApp</button>
    <button onclick="closeCart()">Cerrar</button>
  </div>
</div>

<!-- ADMIN -->
<div class="modal" id="admin">
  <div class="modal-content">
    <h3>Panel Admin</h3>
    <pre id="orders"></pre>
    <button onclick="closeAdmin()">Cerrar</button>
  </div>
</div>

<script>

const BRAND = {
    name: "H ESSENTIALS",
    whatsapp: "584122687310" // tu número real
  };

const products=[
  {id:1,name:"Essential Jacket",price:180,cat:"ropa",img:"https://images.unsplash.com/photo-1523381210434-271e8be1f52b"},
  {id:2,name:"Minimal Watch",price:95,cat:"accesorio",img:"https://images.unsplash.com/photo-1520975916090-3105956dac38"},
  {id:3,name:"Leather Bag",price:120,cat:"accesorio",img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f"}
];

let cart=JSON.parse(localStorage.getItem("cart"))||[];

function render(cat="all"){
  const p=document.getElementById("products");
  p.innerHTML="";
  products.filter(x=>cat=="all"||x.cat==cat).forEach(pr=>{
    p.innerHTML+=`
    <div class="card">
      <img src="${pr.img}">
      <h3>${pr.name}</h3>
      <div class="price">$${pr.price}</div>
      <button onclick="add(${pr.id})">Añadir</button>
    </div>`;
  });
}
render();

function add(id){
  cart.push(products.find(p=>p.id==id));
  localStorage.setItem("cart",JSON.stringify(cart));
  update();
}
function update(){
  document.getElementById("cartCount").innerText=cart.length;
}
update();

function openCart(){
  document.getElementById("cart").style.display="flex";
  const c=document.getElementById("cartItems");
  c.innerHTML="";
  let total=0;
  cart.forEach(p=>{
    total+=p.price;
    c.innerHTML+=`<p>${p.name} - $${p.price}</p>`;
  });
  document.getElementById("total").innerText=total;
}
function closeCart(){cartBox(false)}
function cartBox(v){document.getElementById("cart").style.display=v?"flex":"none"}

function filter(c){render(c)}

function checkout(){
  const orders=JSON.parse(localStorage.getItem("orders"))||[];
  orders.push(cart);
  localStorage.setItem("orders",JSON.stringify(orders));
  alert("Compra registrada");
  cart=[];
  localStorage.removeItem("cart");
  update();
  closeCart();
}

function sendWhatsApp(){
  let msg="Pedido:%0A";
  let total=0;
  cart.forEach(p=>{msg+=`- ${p.name} $${p.price}%0A`;total+=p.price});
  msg+=`Total: $${total}`;
  window.open(`https://wa.me/${BRAND.whatsapp}?text=${msg}`);
}

function openAdmin(){
  document.getElementById("admin").style.display="flex";
  document.getElementById("orders").innerText=localStorage.getItem("orders");
}
function closeAdmin(){document.getElementById("admin").style.display="none"}
</script>

</body>
</html>
