<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H ESSENTIALS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
  <!-- LOGO -->
  <div class="logo">H</div>

  <!-- NAV DESKTOP -->
  <nav class="nav-desktop">
    <span>Shop</span>
    <span>Collection</span>
  </nav>

  <!-- ACCIONES DESKTOP -->
  <div class="header-actions">
    <button class="cart-btn" onclick="toggleCart()">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>

  <!-- MOBILE FLOATING NAV -->
<div class="mobile-floating-nav">
  <button class="nav-icon" onclick="toggleSearch()">🔍</button>

  <button class="nav-icon nav-whatsapp" onclick="sendWhatsAppDirect()">
    💬
  </button>

  <button class="nav-icon" onclick="toggleCart()">
    🛒 <span id="mobileCartCount">0</span>
  </button>
</div>

<!-- ISOTIPO MÓVIL -->
<div class="mobile-brand">H</div>

</header>
  <div class="hero">
    <h1>FOR THE FEW.<br>ESSENTIALS.</h1>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setCategory('all',this)">Todos</button>
    <button class="filter-btn" onclick="setCategory('ropa',this)">Ropa</button>
    <button class="filter-btn" onclick="setCategory('accesorios',this)">Accesorios</button>
    <button class="filter-btn" onclick="setCategory('calzado',this)">Calzado</button>

    <select onchange="setPrice(this.value)">
      <option value="all">Todos los precios</option>
      <option value="low">Menos $100</option>
      <option value="mid">$100–$200</option>
      <option value="high">Más $200</option>
    </select>
  </div>

  <section>
    <div class="products" id="products"></div>
  </section>

  <!-- CARRITO -->
  <div class="cart-drawer" id="cartDrawer">
    <header>
      <h3>Carrito</h3>
      <span onclick="toggleCart()">✕</span>
</header>

  <!-- ✅ ESTE ERA EL ELEMENTO QUE FALTABA -->
  <div class="cart-items" id="cartItems"></div>

  <div class="cart-footer">
    <p>Total: $<span id="total">0</span></p>
    <button class="btn" onclick="clearCart()">Limpiar carrito</button>
    <button class="btn" onclick="sendWhatsApp()">WhatsApp</button>
  </div>
</div>

<!-- PRODUCT VIEW -->
<div class="product-view" id="productView">
  <div class="pv-content">
    <div class="viewer360" id="viewer">
      <img id="viewerImg">
    </div>

    <div class="pv-info">
      <span class="pv-close" onclick="closeProduct()">✕</span>
      <h2 id="pvName"></h2>
      <p class="pv-price">$<span id="pvPrice"></span></p>

      <div class="sizes">
        <p><strong>Talla</strong></p>
        <div id="sizeOptions" class="size-options"></div>
      </div>

      <button class="btn" onclick="addCurrentProduct()">Añadir al carrito</button>
    </div>
  </div>
</div>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Buscar productos..."
      oninput="searchProducts(this.value)"
    >
    <span class="close-search" onclick="toggleSearch()">✕</span>

    <div class="search-results" id="searchResults"></div>
  </div>
</div>
S
<script src="script.js"></script>
</body>
</html>
